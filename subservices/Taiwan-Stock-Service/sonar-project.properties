sonar.projectKey=taiwan-stock-research-agent
sonar.projectName=Taiwan Stock Research Agent
sonar.projectVersion=1.0

# Paths to source and tests
sonar.sources=.
sonar.tests=tests
sonar.language=py
sonar.python.version=3.12

# File exclusions from analysis
sonar.exclusions=**/tests/**, **/.venv/**, **/reports/**, **/db/*.db, **/*.md, **/pyproject.toml, **/uv.lock, **/docker-compose.sonar.yml, **/run_sonar_analysis.sh

# Exclude CLI, server, and main runner from coverage metrics
sonar.coverage.exclusions=**/cli.py, **/mcp_server.py, **/main.py

# Path to python coverage XML report
sonar.python.coverage.reportPaths=coverage.xml
