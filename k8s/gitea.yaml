apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-pvc
  namespace: roychshao
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-service
  namespace: roychshao
  labels:
    app: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 2222
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: roychshao
  labels:
    app: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.23
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 2222
              name: ssh
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__ENABLE_PASSWORD_COMPLEXITY
              value: "false"
            - name: GITEA__security__MIN_PASSWORD_LENGTH
              value: "4"
            - name: GITEA__server__DOMAIN
              value: "localhost"
            - name: GITEA__server__ROOT_URL
              value: "http://localhost:3000/"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__SSH_PORT
              value: "2222"
            - name: GITEA__server__SSH_LISTEN_PORT
              value: "2222"
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: "postgres-service:5432"
            - name: GITEA__database__NAME
              value: "gitea"
            - name: GITEA__database__USER
              value: "postgres"
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secret
                  key: POSTGRES_PASSWORD
            - name: GITEA__database__SSL_MODE
              value: "disable"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__service__REGISTER_EMAIL_CONFIRM
              value: "false"
            - name: GITEA__service__ENABLE_NOTIFY_MAIL
              value: "false"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: GITEA__webhook__ALLOWED_HOST_LIST
              value: "*"
          volumeMounts:
            - name: gitea-storage
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
      volumes:
        - name: gitea-storage
          persistentVolumeClaim:
            claimName: gitea-pvc
