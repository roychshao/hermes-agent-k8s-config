apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: roychshao
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /opt/data && chmod -R 775 /opt/data"]
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:latest
        imagePullPolicy: Always
        args: ["gateway", "run"]
        ports:
        - containerPort: 8642
        - containerPort: 8787
        env:
        - name: HOME
          value: /opt/data
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: LOG_LEVEL
        - name: GATEWAY_HEALTH_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: GATEWAY_HEALTH_URL
        - name: HERMES_WEBUI_AGENT_DIR
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_AGENT_DIR
        - name: HERMES_WEBUI_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_PORT
        - name: HERMES_WEBUI_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_HOST
        - name: HERMES_WEBUI_STATE_DIR
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_STATE_DIR
        - name: HERMES_HOME
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_HOME
        - name: HERMES_WEBUI_DEFAULT_WORKSPACE
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_DEFAULT_WORKSPACE
        - name: HERMES_WEBUI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: HERMES_WEBUI_PASSWORD
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: TS_AUTHKEY
        - name: TS_KUBE_SECRET
          value: tailscale-state
        - name: TS_USERSPACE
          value: "true"
        securityContext:
          runAsUser: 1000
      volumes:
      - name: hermes-data
        persistentVolumeClaim:
          claimName: hermes-agent-pvc
