apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: roychshao
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-permissions
        image: busybox
        command: ["sh", "-c", "chmod 777 /opt/data && mkdir -p /opt/data/webui /opt/data/workspace && chown -R 10000:10000 /opt/data && chmod -R 777 /opt/data"]
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:latest
        imagePullPolicy: Always
        args: ["gateway", "run"]
        ports:
        - containerPort: 8642
        env:
        - name: HOME
          value: /opt/data
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: LOG_LEVEL
        - name: GATEWAY_HEALTH_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: GATEWAY_HEALTH_URL
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
      - name: hermes-webui
        image: ghcr.io/nesquena/hermes-webui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8787
        env:
        - name: WANTED_UID
          value: "10000"
        - name: WANTED_GID
          value: "10000"
        - name: HERMES_HOME
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_HOME
        - name: HERMES_WEBUI_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_PORT
        - name: HERMES_WEBUI_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_HOST
        - name: HERMES_WEBUI_STATE_DIR
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_STATE_DIR
        - name: HERMES_WEBUI_DEFAULT_WORKSPACE
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_DEFAULT_WORKSPACE
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: BRAVE_API_KEY
        - name: LITE_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: LITE_LLM_API_KEY
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "0.5"
            memory: "1Gi"
      volumes:
      - name: hermes-data
        persistentVolumeClaim:
          claimName: hermes-agent-pvc
