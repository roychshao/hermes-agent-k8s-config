apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: roychshao
  labels:
    app: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      initContainers:
      - name: init-permissions
        image: busybox
        command: ["sh", "-c", "chown 10000:10000 /opt/data && chmod 775 /opt/data"]
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      - name: init-mcp-config
        image: busybox
        command:
        - "sh"
        - "-c"
        - |
          if [ ! -f /opt/data/config.yaml ]; then
            cat << 'EOF' > /opt/data/config.yaml
          dashboard:
            show_token_analytics: true
          mcp_servers:
            taiwan-stock-service:
              url: "http://taiwan-stock-service:8000/sse"
              transport: sse
          EOF
          elif ! grep -q "taiwan-stock-service" /opt/data/config.yaml; then
            cat << 'EOF' >> /opt/data/config.yaml

          mcp_servers:
            taiwan-stock-service:
              url: "http://taiwan-stock-service:8000/sse"
              transport: sse
          EOF
          fi
          chown -R 10000:10000 /opt/data/config.yaml
          mkdir -p /opt/data/site-packages
          chown -R 10000:10000 /opt/data/site-packages
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      containers:
      - name: hermes-agent
        image: roychshao/hermes-agent@sha256:53791e5d08b8c4d8030ae663004b7e52b70b8193a2332b3ad48362a5205c7866
        imagePullPolicy: IfNotPresent
        args: ["gateway", "run"]
        ports:
        - containerPort: 8642
        - containerPort: 8787
        - containerPort: 9119
        env:
        - name: DOCKER_HOST
          value: "tcp://localhost:2375"
        - name: HOME
          value: /opt/data
        - name: PYTHONPATH
          value: /opt/data/site-packages
        - name: HERMES_DASHBOARD
          value: "true"
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: "admin"
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: HERMES_WEBUI_PASSWORD
        - name: DISCORD_ALLOW_ALL_USERS
          value: "true"
        - name: AGENT_BROWSER_ARGS
          value: "--no-sandbox,--disable-dev-shm-usage"
        - name: AGENT_BROWSER_EXECUTABLE_PATH
          value: "/opt/hermes/.playwright/chromium_headless_shell-1234/chrome-headless-shell-linux64/chrome-headless-shell"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: LOG_LEVEL
        - name: GATEWAY_HEALTH_URL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: GATEWAY_HEALTH_URL
        - name: HERMES_WEBUI_AGENT_DIR
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_AGENT_DIR
        - name: HERMES_WEBUI_PORT
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_PORT
        - name: HERMES_WEBUI_HOST
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_HOST
        - name: HERMES_WEBUI_STATE_DIR
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_STATE_DIR
        - name: HERMES_HOME
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_HOME
        - name: HERMES_WEBUI_DEFAULT_WORKSPACE
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: HERMES_WEBUI_DEFAULT_WORKSPACE
        - name: HERMES_WEBUI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: HERMES_WEBUI_PASSWORD
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: BRAVE_API_KEY
        - name: LITE_LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-agent-secret
              key: LITE_LLM_API_KEY
        - name: LLM_API_BASE
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: LLM_API_BASE
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: hermes-agent-config
              key: LLM_MODEL
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
        resources:
          requests:
            cpu: "2"
            memory: "5Gi"
          limits:
            cpu: "2.5"
            memory: "7Gi"
      - name: dind
        image: docker:27-dind
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "3.5"
            memory: "7Gi"
        volumeMounts:
        - name: dind-storage
          mountPath: /var/lib/docker
      volumes:
      - name: hermes-data
        persistentVolumeClaim:
          claimName: hermes-agent-pvc
      - name: dind-storage
        emptyDir:
          sizeLimit: 20Gi
